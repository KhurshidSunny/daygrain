[build]
  command = "npm run build"

# Tool SPAs live in public/<slug> (built from tools/<slug>).
# Static files under /<slug>/assets/* are served first; these are fallbacks.
[[redirects]]
  from = "/focus"
  to = "/focus/index.html"
  status = 200

[[redirects]]
  from = "/focus/"
  to = "/focus/index.html"
  status = 200

[[redirects]]
  from = "/focus/*"
  to = "/focus/index.html"
  status = 200

[[redirects]]
  from = "/decide"
  to = "/decide/index.html"
  status = 200

[[redirects]]
  from = "/decide/"
  to = "/decide/index.html"
  status = 200

[[redirects]]
  from = "/decide/*"
  to = "/decide/index.html"
  status = 200

[[redirects]]
  from = "/colors"
  to = "/colors/index.html"
  status = 200

[[redirects]]
  from = "/colors/"
  to = "/colors/index.html"
  status = 200

[[redirects]]
  from = "/colors/*"
  to = "/colors/index.html"
  status = 200

[[redirects]]
  from = "/data"
  to = "/data/index.html"
  status = 200

[[redirects]]
  from = "/data/"
  to = "/data/index.html"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/data/index.html"
  status = 200

[[plugins]]
  package = "@netlify/plugin-nextjs"
