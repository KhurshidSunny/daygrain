[build]
  command = "npm run build"

# Focus SPA lives in public/focus (built from tools/focus)
# Static files under /focus/assets/* are served first; these are fallbacks.
[[redirects]]
  from = "/focus"
  to = "/focus/index.html"
  status = 200

[[redirects]]
  from = "/focus/"
  to = "/focus/index.html"
  status = 200

[[redirects]]
  from = "/focus/*"
  to = "/focus/index.html"
  status = 200

[[plugins]]
  package = "@netlify/plugin-nextjs"
