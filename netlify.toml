[build]
  command = "npm run build -- --webpack"

# Proxy Focus app under the main domain path.
# If your focus site URL differs, update the target host accordingly.
[[redirects]]
  from = "/focus/*"
  to = "https://daygrain-focus.netlify.app/focus/:splat"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
